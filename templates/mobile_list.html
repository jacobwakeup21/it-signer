{% extends "base.html" %}

{% block title %}Sign IT Handover — Mobile Portal{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-4">
    <!-- Search input -->
    <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-cyan-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="mobSearchInput" oninput="filterMobileDocs()" placeholder="Search by name, device, or filename..." class="w-full bg-[#0b1329] border border-cyan-500/30 rounded-xl pl-9 pr-3 py-2.5 text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-cyan-400 focus:outline-none shadow-inner">
    </div>

    <!-- Tab Selector -->
    <div class="flex bg-[#0b1329] p-1 rounded-xl border border-cyan-500/25 shadow-md">
        <button id="tabPendingBtn" onclick="switchMobileTab('pending')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-gradient-to-r from-cyan-600 via-sky-600 to-blue-600 text-white transition flex items-center justify-center gap-1.5 shadow-md shadow-cyan-600/30">
            <i data-lucide="clock" class="w-3.5 h-3.5 text-cyan-200"></i>
            Pending (<span id="mobPendingCount">0</span>)
        </button>
        <button id="tabSignedBtn" onclick="switchMobileTab('signed')" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5">
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
            Completed (<span id="mobSignedCount">0</span>)
        </button>
    </div>

    <!-- Pending Document List Container -->
    <div id="mobPendingList" class="space-y-3">
        <div class="py-12 text-center text-slate-500 text-sm">
            <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-sky-400"></i>
            Loading documents...
        </div>
    </div>

    <!-- Signed Document List Container (Hidden by default) -->
    <div id="mobSignedList" class="space-y-3 hidden">
        <div class="py-12 text-center text-slate-500 text-sm">
            Loading completed documents...
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentTab = 'pending';
let pendingFiles = [];
let signedFiles = [];
let mobSearchQuery = '';

function formatLocalTime(epochSec, fallbackStr) {
    if (epochSec && typeof epochSec === 'number') {
        const d = new Date(epochSec * 1000);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    return fallbackStr || '';
}

async function fetchMobileDocs() {
    try {
        const res = await fetch('/api/documents');
        const data = await res.json();
        
        pendingFiles = data.pending || [];
        signedFiles = data.signed || [];

        document.getElementById('mobPendingCount').textContent = pendingFiles.length;
        document.getElementById('mobSignedCount').textContent = signedFiles.length;

        filterMobileDocs();
    } catch (err) {
        console.error('Error fetching documents:', err);
    }
}

function filterMobileDocs() {
    const input = document.getElementById('mobSearchInput');
    mobSearchQuery = input ? input.value.trim().toLowerCase() : '';

    const filterFn = f => {
        if (!mobSearchQuery) return true;
        const metaStr = f.metadata ? `${f.metadata.employee_name || ''} ${f.metadata.email || ''} ${(f.metadata.hardware || []).join(' ')}` : '';
        const full = `${f.name} ${f.modified_formatted} ${metaStr}`.toLowerCase();
        return full.includes(mobSearchQuery);
    };

    renderPending(pendingFiles.filter(filterFn));
    renderSigned(signedFiles.filter(filterFn));
}

function renderPending(files) {
    const container = document.getElementById('mobPendingList');
    if (!files || files.length === 0) {
        container.innerHTML = `
            <div class="bg-[#0b1329]/70 border border-cyan-500/20 rounded-2xl p-8 text-center space-y-3 shadow-xl">
                <div class="w-12 h-12 rounded-full bg-[#101c3d] text-cyan-400 flex items-center justify-center mx-auto border border-cyan-500/30">
                    <i data-lucide="inbox" class="w-6 h-6"></i>
                </div>
                <h3 class="text-sm font-bold text-white">${mobSearchQuery ? 'No matching documents' : 'No Pending Documents'}</h3>
                <p class="text-xs text-slate-400">All IT handover files are signed.</p>
            </div>
        `;
        if (window.lucide) lucide.createIcons();
        return;
    }

    container.innerHTML = files.map(file => {
        const meta = file.metadata || {};
        const employeeName = meta.employee_name;
        const hwFirst = meta.hardware && meta.hardware.length > 0 ? meta.hardware[0] : null;

        return `
        <div class="bg-[#0b1329]/90 border border-cyan-500/25 hover:border-cyan-400/50 rounded-2xl p-4 shadow-xl shadow-cyan-950/30 flex flex-col gap-3 transition">
            <div class="flex items-start gap-3">
                <div class="w-16 h-20 bg-[#070c18] rounded-lg overflow-hidden border border-cyan-500/30 flex-shrink-0 relative">
                    <img src="${file.preview_url}?zoom=0.8" alt="Thumbnail" class="w-full h-full object-cover">
                    <span class="absolute bottom-0 inset-x-0 bg-black/75 text-[9px] text-center font-mono py-0.5 text-cyan-300 font-semibold">${file.page_count}p</span>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="text-sm font-bold text-white truncate">${file.name}</h3>
                    <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1">
                        <i data-lucide="calendar" class="w-3 h-3 text-cyan-400"></i> ${formatLocalTime(file.modified_timestamp, file.modified_formatted)}
                    </p>

                    <!-- Extracted Metadata -->
                    <div class="mt-1 flex flex-wrap gap-1">
                        ${employeeName ? `
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-cyan-500/15 text-cyan-300 text-[10px] font-semibold border border-cyan-400/30 truncate max-w-full">
                                <i data-lucide="user" class="w-2.5 h-2.5"></i> ${employeeName}
                            </span>
                        ` : ''}
                        ${hwFirst ? `
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px] font-medium border border-indigo-500/30 truncate max-w-full" title="${hwFirst}">
                                <i data-lucide="smartphone" class="w-2.5 h-2.5"></i> ${hwFirst.split('//')[0].trim()}
                            </span>
                        ` : ''}
                    </div>
                </div>
            </div>
            <a href="/sign/${encodeURIComponent(file.name)}" class="w-full py-3 bg-gradient-to-r from-cyan-600 via-sky-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-xl text-sm font-bold tracking-wide shadow-lg shadow-cyan-600/30 flex items-center justify-center gap-2 transition active:scale-[0.98]">
                <i data-lucide="pen-tool" class="w-4 h-4"></i>
                Sign Document Now
            </a>
        </div>
        `;
    }).join('');

    if (window.lucide) lucide.createIcons();
}

function renderSigned(files) {
    const container = document.getElementById('mobSignedList');
    if (!files || files.length === 0) {
        container.innerHTML = `
            <div class="bg-[#0b1329]/70 border border-cyan-500/20 rounded-2xl p-8 text-center space-y-2 shadow-xl">
                <i data-lucide="check-circle" class="w-8 h-8 mx-auto text-emerald-400"></i>
                <p class="text-xs text-slate-400">No completed documents.</p>
            </div>
        `;
        if (window.lucide) lucide.createIcons();
        return;
    }

    container.innerHTML = files.map(file => {
        const meta = file.metadata || {};
        const employeeName = meta.employee_name;

        return `
        <div class="bg-[#0b1329]/90 border border-emerald-500/30 rounded-2xl p-3.5 shadow-xl flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-12 h-16 bg-[#070c18] rounded-lg overflow-hidden border border-emerald-500/30 flex-shrink-0">
                    <img src="${file.last_page_preview_url || file.preview_url}?zoom=0.6" alt="Thumbnail" class="w-full h-full object-cover">
                </div>
                <div class="min-w-0">
                    <h4 class="text-xs font-bold text-white truncate">${file.name}</h4>
                    <p class="text-[10px] text-slate-400">${formatLocalTime(file.modified_timestamp, file.modified_formatted)}</p>
                    ${employeeName ? `
                        <span class="text-[10px] text-cyan-300 font-medium block truncate">👤 ${employeeName}</span>
                    ` : ''}
                    <span class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1 mt-0.5">
                        <i data-lucide="check" class="w-3 h-3"></i> Signed
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <a href="${file.download_url}" target="_blank" class="p-2 bg-[#101c3d] hover:bg-[#182b5c] text-cyan-300 border border-cyan-500/30 rounded-lg text-xs font-medium flex items-center shadow" title="Download">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                </a>
                <button onclick="deleteMobileDoc('signed', '${file.name}')" class="p-2 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-medium flex items-center" title="Delete">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
        `;
    }).join('');

    if (window.lucide) lucide.createIcons();
}

async function deleteMobileDoc(folder, filename) {
    if (!confirm(`Remove "${filename}" from list?`)) return;
    try {
        const res = await fetch(`/api/delete/${folder}/${encodeURIComponent(filename)}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            fetchMobileDocs();
        }
    } catch (e) {
        alert('Failed to remove document.');
    }
}

function switchMobileTab(tab) {
    currentTab = tab;
    const pBtn = document.getElementById('tabPendingBtn');
    const sBtn = document.getElementById('tabSignedBtn');
    const pList = document.getElementById('mobPendingList');
    const sList = document.getElementById('mobSignedList');

    if (tab === 'pending') {
        pBtn.className = 'flex-1 py-2 rounded-lg text-xs font-bold bg-gradient-to-r from-cyan-600 via-sky-600 to-blue-600 text-white transition flex items-center justify-center gap-1.5 shadow-md shadow-cyan-600/30';
        sBtn.className = 'flex-1 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5';
        pList.classList.remove('hidden');
        sList.classList.add('hidden');
    } else {
        sBtn.className = 'flex-1 py-2 rounded-lg text-xs font-bold bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 text-white transition flex items-center justify-center gap-1.5 shadow-md shadow-emerald-600/30';
        pBtn.className = 'flex-1 py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5';
        sList.classList.remove('hidden');
        pList.classList.add('hidden');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    fetchMobileDocs();
    setInterval(fetchMobileDocs, 5000);
});
</script>
{% endblock %}
