{% extends "base.html" %}

{% block title %}{{ title or "Error" }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12 text-center space-y-6">
    <div class="bg-slate-800 border border-rose-500/30 rounded-3xl p-8 shadow-2xl space-y-4">
        <div class="w-16 h-16 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
            <i data-lucide="alert-triangle" class="w-8 h-8"></i>
        </div>

        <h2 class="text-xl font-bold text-white">{{ title or "Notice" }}</h2>
        <p class="text-xs sm:text-sm text-slate-300">{{ message or "An unexpected error occurred." }}</p>

        <div class="pt-4">
            <a href="/mobile" class="inline-flex items-center gap-2 px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-semibold transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Return to Documents
            </a>
        </div>
    </div>
</div>
{% endblock %}
