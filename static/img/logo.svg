<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="104" height="104" rx="26" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Background Document/Shield Contour -->
  <path d="M38 32 C38 28 42 26 46 26 L74 26 C78 26 82 28 82 32 L82 72 C82 82 60 92 60 92 C60 92 38 82 38 72 Z" fill="#0f172a" fill-opacity="0.45" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Document Guidelines -->
  <line x1="48" y1="42" x2="72" y2="42" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="48" y1="50" x2="66" y2="50" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Luminous Signature Path -->
  <path d="M34 76 C42 66 52 64 56 70 C60 76 62 82 68 76 C74 70 82 58 86 54" stroke="url(#sigGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Stylus / Digital Pen Nib -->
  <g transform="translate(68, 22) rotate(28)">
    <rect x="0" y="0" width="8" height="34" rx="4" fill="url(#penGrad)" stroke="#ffffff" stroke-width="1" />
    <path d="M0 34 L4 44 L8 34 Z" fill="#f8fafc" />
    <circle cx="4" cy="42" r="1.2" fill="#38bdf8" />
    <rect x="2" y="8" width="4" height="10" rx="1" fill="#0f172a" fill-opacity="0.4" />
  </g>

  <!-- Cross-device Connection Dots -->
  <circle cx="28" cy="92" r="3.5" fill="#38bdf8" />
  <circle cx="92" cy="92" r="3.5" fill="#34d399" />
  <line x1="32" y1="92" x2="88" y2="92" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6" />
</svg>
