services:
  - type: web
    name: it-handover-signer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    plan: free
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - signed/**
        - pending/**
        - users_backup.json
        - "*.md"
        - "*.bat"
        - "*.ps1"
        - LICENSE
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
